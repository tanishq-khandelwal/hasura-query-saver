name: Release

# main is the default development branch (see ci.yml). Pushing to master —
# a separate, deliberate release branch — builds a zip, tags it with the
# version from manifest.json, attaches it to a GitHub Release, and — once
# the CWS_* secrets below are configured — uploads it to the Chrome Web
# Store as a draft. Publishing that draft live requires an explicit manual
# run with the "publish" input checked; a plain push to master never
# auto-publishes.
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the uploaded version live on the Chrome Web Store"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Read version from manifest.json
        id: version
        run: echo "tag=v$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Zip extension
        run: cd dist && zip -r ../hasura-query-saver.zip . && cd ..

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" hasura-query-saver.zip \
            --generate-notes --target "${{ github.sha }}"

      # No-ops until the CWS_* secrets are set (see README) — that's expected
      # for every release before the first manual Chrome Web Store submission.
      - name: Upload to Chrome Web Store
        if: ${{ env.EXTENSION_ID != '' }}
        run: npx chrome-webstore-upload-cli@3 upload --source dist --extension-id "$EXTENSION_ID"

      - name: Publish to Chrome Web Store
        if: ${{ env.EXTENSION_ID != '' && inputs.publish == true }}
        run: npx chrome-webstore-upload-cli@3 publish --extension-id "$EXTENSION_ID"
